<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Fighter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
    }

    /* Hidden file input used by CardCreatorScene for image uploads */
    #card-image-upload {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Hidden file input for card image uploads (used by CardCreatorScene) -->
    <input
      type="file"
      id="card-image-upload"
      accept="image/*"
      aria-label="Upload card image"
    />
  </div>

  <!-- Load Phaser from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Game entry point -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
